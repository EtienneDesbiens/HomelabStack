services:
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    ports:
      - "6767:6767"
    volumes:
      - ${FAST_ROOT}/appdata/bazarr:/config
      - ${BULK_ROOT}/media/movies:/movies
      - ${BULK_ROOT}/media/tv:/tv
    networks:
      - proxy-net

networks:
  proxy-net:
    external: true
