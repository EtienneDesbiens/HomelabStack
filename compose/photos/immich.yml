# Follows Immich's own official compose shape (server + machine-learning +
# redis + a pgvector-enabled Postgres). Pin IMMICH_VERSION to a specific
# release once you've done a first successful deploy, rather than tracking
# "release" indefinitely -- Immich moves fast and ties server/ML image
# versions together.
services:
  immich-redis:
    image: redis:6.2-alpine
    container_name: immich-redis
    restart: unless-stopped
    networks:
      - proxy-net

  immich-db:
    image: tensorchord/pgvecto-rs:pg14-v0.2.0
    container_name: immich-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=immich
      - POSTGRES_USER=immich
      - POSTGRES_PASSWORD=${IMMICH_DB_PASSWORD:-changeme_immich_db}
    volumes:
      - ${FAST_ROOT}/appdata/immich/db:/var/lib/postgresql/data
    networks:
      - proxy-net

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:release
    container_name: immich-machine-learning
    restart: unless-stopped
    volumes:
      - ${FAST_ROOT}/appdata/immich/model-cache:/cache
    networks:
      - proxy-net

  immich-server:
    image: ghcr.io/immich-app/immich-server:release
    container_name: immich-server
    restart: unless-stopped
    depends_on:
      - immich-redis
      - immich-db
      - immich-machine-learning
    environment:
      - DB_HOSTNAME=immich-db
      - DB_USERNAME=immich
      - DB_PASSWORD=${IMMICH_DB_PASSWORD:-changeme_immich_db}
      - DB_DATABASE_NAME=immich
      - REDIS_HOSTNAME=immich-redis
    ports:
      - "2283:2283"
    volumes:
      - ${BULK_ROOT}/photos/immich:/usr/src/app/upload
    networks:
      - proxy-net

networks:
  proxy-net:
    external: true
